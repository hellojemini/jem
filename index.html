<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Redirect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        
        .shorts-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #ff0000;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.2);
        }
        
        .shorts-btn:hover {
            background: #cc0000;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 0, 0, 0.3);
        }
        
        .shorts-btn:active {
            transform: translateY(0);
        }
        
        .shorts-btn i {
            font-size: 20px;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .shorts-btn {
                padding: 14px 28px;
                font-size: 17px;
            }
        }
        
        @media (max-width: 480px) {
            .shorts-btn {
                padding: 13px 26px;
                font-size: 16px;
            }
            
            .shorts-btn i {
                font-size: 18px;
            }
        }
        
        @media (max-width: 360px) {
            .shorts-btn {
                padding: 12px 24px;
                font-size: 15px;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <a href="https://youtube.com/shorts/bbrjlUdKMbc?si=tfbqo33Qog5OZ-O5" target="_blank" class="shorts-btn">
        <i class="fab fa-youtube"></i>
       Click Here
    </a>
    
    <script>
        // Optional: Add click tracking
        document.querySelector('.shorts-btn').addEventListener('click', function() {
            console.log('Redirecting to YouTube Shorts...');
            // You can add analytics tracking here
        });
    </script>
</body>
</html>
